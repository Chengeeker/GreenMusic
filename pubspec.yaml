name: greenmusic
description: QQ Music client with Review's Material 3 interface.
publish_to: none
version: 1.0.0+28
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dynamic_color: ^1.9.0
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  crypto: ^3.0.6
  pointycastle: ^4.0.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^11.2.0
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.2
  path_provider: ^2.1.4
  html: ^0.15.7
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  liquid_glass_widgets:
    path: packages/liquid_glass_widgets
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - docs/REVIEW_LICENSE
    - docs/MATERIAL_ICONS_LICENSE

